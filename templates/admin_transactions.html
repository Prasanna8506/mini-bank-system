<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transaction History · ATM</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
    <div class="brand"><span class="brand-mark">A</span> ATM</div>
    <nav class="nav">
        <a href="/admin">Back</a>
        <a href="/logout" class="logout">Logout</a>
    </nav>
</header>

<main class="container">

    <div class="page-head">
        <h2>Transaction History</h2>
    </div>

    <section class="card">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Type</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody>
                {% for t in transactions %}
                    <tr>
                        <td class="muted mono">{{t.user_id}}</td>
                        <td><span class="badge badge-{{t.type|lower}}">{{t.type}}</span></td>
                        <td class="mono">{{t.amount}}</td>
                    </tr>
                {% else %}
                    <tr><td colspan="3" class="empty">No transactions yet</td></tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </section>

</main>

</body>
</html>
