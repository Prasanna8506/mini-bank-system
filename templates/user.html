<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Dashboard · ATM</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
    <div class="brand"><span class="brand-mark">A</span> ATM</div>
    <nav class="nav">
        <a href="#" class="active">User Dashboard</a>
        <a href="/logout" class="logout">Logout</a>
    </nav>
</header>

<main class="container">

    <div class="page-head">
        <h2>User Dashboard</h2>
        <p>Welcome {{user.username}}</p>
    </div>

    <div class="grid-2">
        <section class="card">
            <h3 style="margin-bottom:14px;">Welcome {{user.username}}</h3>
            <div class="stat-label">Coins</div>
            <div class="stat-value">{{user.coins}}</div>
        </section>

        <section class="card">
            <h3 style="margin-bottom:14px;">Spend Coins</h3>
            <form method="post" class="inline-form">
                <input type="number" name="amount" placeholder="Amount" required>
                <button type="submit">Spend</button>
            </form>
        </section>
    </div>

    <section class="card">
        <div class="card-head">
            <h3>Transactions</h3>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody>
                {% for t in transactions %}
                    <tr>
                        <td><span class="badge badge-{{t.type|lower}}">{{t.type}}</span></td>
                        <td class="mono">{{t.amount}}</td>
                    </tr>
                {% else %}
                    <tr><td colspan="2" class="empty">No transactions yet</td></tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </section>

</main>

</body>
</html>
