<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login · ATM</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth">

<div class="auth-shell">

    <div class="auth-brand">
        <div class="brand-mark">ATM</div>
        <div>
            <h2>Login</h2>
            <p>Sign in to your account</p>
        </div>
    </div>

    <div class="card auth-card">

        {% if error %}
            <div class="alert alert-error" role="alert">{{error}}</div>
        {% endif %}

        <form method="post">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
            </div>

            <button type="submit" class="btn-block">Login</button>
        </form>

    </div>

    <p class="auth-foot">New here? <a href="/register">Register Here</a></p>

</div>

</body>
</html>
